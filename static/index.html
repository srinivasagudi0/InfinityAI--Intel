<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfinityAI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f766e'/%3E%3Cpath d='M18 44 32 14l14 30h-8l-3-7H29l-3 7h-8Zm13-13h2l-1-3-1 3Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ff;
      --panel: rgba(255, 255, 255, .86);
      --panel-2: #f4efff;
      --text: #211744;
      --muted: #746c8f;
      --line: rgba(112, 88, 180, .18);
      --accent: #6d4aff;
      --accent-2: #ff4fa3;
      --danger: #df245f;
      --shadow: 0 20px 55px rgba(68, 38, 125, .14);
      --rainbow: linear-gradient(105deg, #ff2d7d, #ff7a18, #ffd600, #26d980, #12c7e8, #4768ff, #a855f7, #ff2d7d);
    }
    * { box-sizing: border-box; }
    @keyframes rainbow-slide {
      to { background-position: 200% center; }
    }
    @keyframes color-float {
      50% { transform: translate3d(24px, -18px, 0) scale(1.08); }
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 82, 182, .28), transparent 28%),
        radial-gradient(circle at 86% 8%, rgba(65, 215, 255, .30), transparent 28%),
        radial-gradient(circle at 80% 90%, rgba(255, 193, 77, .30), transparent 30%),
        radial-gradient(circle at 18% 86%, rgba(111, 255, 173, .25), transparent 28%),
        linear-gradient(135deg, #fbf7ff 0%, #effbff 48%, #fff8eb 100%);
      background-attachment: fixed;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .34;
      z-index: 0;
      pointer-events: none;
      animation: color-float 9s ease-in-out infinite;
    }
    body::before {
      left: 34%;
      top: -170px;
      background: conic-gradient(#ff2d7d, #ffd600, #26d980, #12c7e8, #a855f7, #ff2d7d);
    }
    body::after {
      right: -110px;
      bottom: -170px;
      background: conic-gradient(#12c7e8, #4768ff, #a855f7, #ff2d7d, #ff7a18, #12c7e8);
      animation-delay: -4.5s;
    }
    button, input, textarea, select {
      font: inherit;
      letter-spacing: 0;
    }
    button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .82);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      min-height: 38px;
      font-weight: 650;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(80, 44, 150, .14); }
    button.primary {
      background: var(--rainbow);
      background-size: 200% 100%;
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 22px rgba(117, 68, 255, .25);
      animation: rainbow-slide 7s linear infinite;
    }
    button.blue {
      background: linear-gradient(135deg, #06b6d4, #3b82f6 55%, #8b5cf6);
      border-color: transparent;
      color: #fff;
    }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .86);
      color: var(--text);
      padding: 10px 12px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .12);
    }
    textarea { resize: vertical; min-height: 88px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 238px 1fr;
      position: relative;
      z-index: 1;
    }
    aside {
      background:
        linear-gradient(165deg, rgba(28, 13, 67, .97), rgba(50, 21, 99, .94) 52%, rgba(18, 70, 93, .94));
      color: #fff;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
      box-shadow: 12px 0 40px rgba(43, 22, 84, .16);
      position: relative;
      overflow: hidden;
    }
    aside::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 79, 163, .55), rgba(43, 216, 255, .45));
      filter: blur(45px);
      top: -90px;
      right: -90px;
      pointer-events: none;
    }
    aside::after {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: var(--rainbow);
      background-size: 200% 100%;
      animation: rainbow-slide 7s linear infinite;
    }
    .brand {
      font-weight: 900;
      font-size: 25px;
      letter-spacing: -.8px;
      background: linear-gradient(90deg, #fff, #8df4ff, #ff9ed1, #ffd36f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      background-size: 200% 100%;
      animation: rainbow-slide 6s linear infinite;
    }
    nav { display: grid; gap: 7px; align-content: start; }
    nav button {
      background: rgba(255, 255, 255, .045);
      color: #e8e0ff;
      border-color: transparent;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    nav button:nth-child(1) { --nav-color: #ff58ad; }
    nav button:nth-child(2) { --nav-color: #9a72ff; }
    nav button:nth-child(3) { --nav-color: #35c7ff; }
    nav button:nth-child(4) { --nav-color: #43dfa0; }
    nav button:nth-child(5) { --nav-color: #ffd05b; }
    nav button:nth-child(6) { --nav-color: #ff8a52; }
    nav button::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
      background: var(--nav-color);
      box-shadow: 0 0 14px var(--nav-color);
    }
    nav button.active {
      background: linear-gradient(90deg, color-mix(in srgb, var(--nav-color) 30%, transparent), rgba(255,255,255,.08));
      color: #fff;
      border-color: color-mix(in srgb, var(--nav-color) 55%, transparent);
    }
    .workspace-badge {
      color: #e9e2ff;
      font-size: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      position: relative;
    }
    .workspace-badge::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #4df0a6;
      box-shadow: 0 0 12px #4df0a6;
    }
    main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(112, 88, 180, .12);
      background: rgba(255, 255, 255, .58);
      backdrop-filter: blur(18px);
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--rainbow);
      background-size: 200% 100%;
      animation: rainbow-slide 8s linear infinite;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.5px;
      background: linear-gradient(90deg, #5635e8, #d9369d, #f08b2f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .status {
      color: #6247a8;
      font-size: 12px;
      text-align: right;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(109,74,255,.16);
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: 0 6px 18px rgba(75, 43, 145, .08);
    }
    .view { min-height: 0; padding: 18px; }
    .view:not(.active) { display: none; }
    .view.active { display: grid; }
    .chat-layout {
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      min-height: 0;
    }
    .panel {
      background:
        linear-gradient(rgba(255,255,255,.86), rgba(255,255,255,.8)) padding-box,
        var(--rainbow) border-box;
      background-size: auto, 200% 100%;
      border: 2px solid transparent;
      border-radius: 18px;
      min-width: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: rainbow-slide 12s linear infinite;
    }
    .chat-panel { display: grid; grid-template-rows: 1fr auto; min-height: calc(100vh - 112px); }
    .messages { padding: 18px; overflow: auto; display: grid; gap: 12px; align-content: start; }
    .message {
      max-width: min(760px, 92%);
      padding: 12px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.45;
      border: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    .message.user {
      justify-self: end;
      color: #fff;
      background: linear-gradient(135deg, #6457f5, #8b5cf6 45%, #ec4899);
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(120, 72, 220, .22);
      border-bottom-right-radius: 5px;
    }
    .message.assistant {
      justify-self: start;
      background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(239,248,255,.96) 52%, rgba(255,241,249,.96));
      border-color: rgba(93, 90, 200, .15);
      box-shadow: 0 8px 22px rgba(72, 45, 130, .09);
      border-bottom-left-radius: 5px;
    }
    .composer {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: linear-gradient(110deg, rgba(255,45,125,.08), rgba(255,214,0,.08), rgba(38,217,128,.08), rgba(18,199,232,.08), rgba(168,85,247,.08));
    }
    .composer-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar select { width: auto; min-width: 170px; max-width: 100%; }
    .toolbar label { display: flex; grid-template-columns: none; align-items: center; gap: 6px; color: var(--text); }
    .toolbar input[type="checkbox"] { width: auto; }
    .toolbar button:nth-of-type(1) { color: #c026d3; border-color: rgba(192,38,211,.24); }
    .toolbar button:nth-of-type(2) { color: #2563eb; border-color: rgba(37,99,235,.24); }
    .toolbar button:nth-of-type(3) { color: #ea580c; border-color: rgba(234,88,12,.24); }
    .toolbar label:nth-of-type(1) { color: #059669; font-weight: 700; }
    .toolbar label:nth-of-type(2) { color: #7c3aed; font-weight: 700; }
    .side-panel { padding: 14px; display: grid; gap: 14px; align-content: start; }
    .side-panel h3, .section h2 {
      margin: 0;
      color: #4d348c;
      letter-spacing: -.25px;
    }
    .view.active.section {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .form-panel, .list-panel {
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--line);
      border-top: 4px solid #8b5cf6;
      background: linear-gradient(135deg, rgba(255,255,255,.88), rgba(247,244,255,.88));
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 8px;
      overflow-wrap: anywhere;
    }
    .item:nth-child(6n+1) { border-top-color: #ff58ad; }
    .item:nth-child(6n+2) { border-top-color: #ff8a52; }
    .item:nth-child(6n+3) { border-top-color: #ffd05b; }
    .item:nth-child(6n+4) { border-top-color: #43dfa0; }
    .item:nth-child(6n+5) { border-top-color: #35c7ff; }
    .item:nth-child(6n) { border-top-color: #9a72ff; }
    .item-title { font-weight: 700; }
    .item-meta { color: var(--muted); font-size: 12px; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-list { display: grid; gap: 8px; max-height: 220px; overflow: auto; }
    .check-list label {
      display: flex;
      grid-template-columns: none;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .check-list input { width: auto; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .shell, .chat-layout, .view.active.section { grid-template-columns: 1fr; }
      aside { grid-template-rows: auto auto auto; }
      nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      nav button { text-align: center; padding-inline: 8px; }
      .chat-panel { min-height: 65vh; }
      header { align-items: flex-start; flex-direction: column; }
      .status { text-align: left; }
    }
    @media (max-width: 560px) {
      .composer-row { grid-template-columns: 1fr; }
      .toolbar select, .toolbar button { width: 100%; }
      .toolbar label { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <section id="app" class="shell">
    <aside>
      <div class="brand">InfinityAI</div>
      <nav id="nav">
        <button data-view="chat" class="active">Chat</button>
        <button data-view="jarvis">Jarvis</button>
        <button data-view="files">Files</button>
        <button data-view="memories">Memory</button>
        <button data-view="agents">Agents</button>
        <button data-view="workflows">Workflows</button>
      </nav>
      <div class="workspace-badge">Open workspace</div>
    </aside>
    <main>
      <header>
        <div>
          <h1 id="viewTitle">Chat</h1>
          <p id="viewSubtitle">Talk with Infinity using memory, files, and agents.</p>
        </div>
        <div id="status" class="status">Ready</div>
      </header>

      <section id="chatView" class="view chat-layout active">
        <div class="panel chat-panel">
          <div id="messages" class="messages"></div>
          <form id="chatForm" class="composer">
            <div class="toolbar">
              <select id="agentSelect"></select>
              <label><input id="memoryToggle" type="checkbox" checked> Memory</label>
              <label><input id="speakToggle" type="checkbox"> Read replies</label>
              <button id="listenBtn" type="button">Listen</button>
              <button id="codeBtn" type="button">Code</button>
              <button id="newChatBtn" type="button">New chat</button>
            </div>
            <div class="composer-row">
              <textarea id="chatInput" placeholder="Message Infinity..." required></textarea>
              <button class="primary" type="submit">Send</button>
            </div>
          </form>
        </div>
        <div class="panel side-panel">
          <h3>Attach files</h3>
          <div id="chatFiles" class="check-list"></div>
          <h3>Run workflow</h3>
          <select id="workflowSelect"></select>
          <button id="workflowChatBtn" class="blue" type="button">Use in chat</button>
        </div>
      </section>

      <section id="filesView" class="view section">
        <form id="fileForm" class="panel form-panel">
          <h2>Upload file</h2>
          <input id="fileInput" type="file" required>
          <button class="primary" type="submit">Upload</button>
        </form>
        <div class="panel list-panel">
          <h2>Your files</h2>
          <div id="filesList" class="list"></div>
        </div>
      </section>

      <section id="memoriesView" class="view section">
        <form id="memoryForm" class="panel form-panel">
          <h2>Add memory</h2>
          <textarea id="memoryInput" placeholder="Remember that..."></textarea>
          <button class="primary" type="submit">Save memory</button>
        </form>
        <div class="panel list-panel">
          <h2>Persistent memory</h2>
          <div id="memoriesList" class="list"></div>
        </div>
      </section>

      <section id="agentsView" class="view section">
        <form id="agentForm" class="panel form-panel">
          <h2 id="agentFormTitle">Create agent</h2>
          <input id="agentName" placeholder="Agent name" required>
          <input id="agentDescription" placeholder="Description">
          <textarea id="agentInstructions" placeholder="Instructions" required></textarea>
          <button class="primary" type="submit">Save agent</button>
          <button id="agentCancelBtn" type="button" class="hidden">Cancel edit</button>
        </form>
        <div class="panel list-panel">
          <h2>Your agents</h2>
          <div id="agentsList" class="list"></div>
        </div>
      </section>

      <section id="workflowsView" class="view section">
        <form id="workflowForm" class="panel form-panel">
          <h2 id="workflowFormTitle">Create workflow</h2>
          <input id="workflowName" placeholder="Workflow name" required>
          <input id="workflowDescription" placeholder="Description">
          <textarea id="workflowSteps" placeholder="One prompt step per line. Use {{input}} and {{previous}}." required></textarea>
          <input id="workflowInput" placeholder="Test input">
          <button class="primary" type="submit">Save workflow</button>
          <button id="workflowRunBtn" class="blue" type="button">Run selected</button>
          <button id="workflowCancelBtn" type="button" class="hidden">Cancel edit</button>
        </form>
        <div class="panel list-panel">
          <h2>Your workflows</h2>
          <div id="workflowsList" class="list"></div>
          <div id="workflowOutput" class="item hidden"></div>
        </div>
      </section>
    </main>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const newId = () => {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return `session-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    };
    const state = {
      view: "chat",
      sessionId: localStorage.getItem("infinity_session") || newId(),
      workspaceId: localStorage.getItem("infinity_workspace") || newId(),
      editAgentId: null,
      editWorkflowId: null,
      runWorkflowId: null,
      pendingWorkflowId: null,
      agents: [],
      files: [],
      memories: [],
      workflows: []
    };
    localStorage.setItem("infinity_session", state.sessionId);
    localStorage.setItem("infinity_workspace", state.workspaceId);
    localStorage.removeItem("infinity_token");

    async function api(path, options = {}) {
      const isForm = options.body instanceof FormData;
      const headers = isForm ? {} : { "Content-Type": "application/json" };
      headers["X-Workspace-ID"] = state.workspaceId;
      const res = await fetch(path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
      const text = await res.text();
      let data = {};
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { detail: text };
        }
      }
      if (!res.ok) throw new Error(data.detail || "Request failed");
      return data;
    }

    function setStatus(text) { $("status").textContent = text; }
    async function runSafely(working, done, action) {
      setStatus(working);
      try {
        const result = await action();
        setStatus(done);
        return result;
      } catch (err) {
        setStatus(err.message);
        return null;
      }
    }
    function escapeText(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }
    function jarvisAgent() { return state.agents.find((agent) => agent.is_default) || state.agents[0]; }

    async function refresh() {
      const [agents, files, memories, workflows] = await Promise.all([
        api("/v1/agents"),
        api("/v1/files"),
        api("/v1/memories"),
        api("/v1/workflows")
      ]);
      state.agents = agents.data || [];
      state.files = files.data || [];
      state.memories = memories.data || [];
      state.workflows = workflows.data || [];
      renderAll();
    }

    async function boot() {
      try {
        await refresh();
        setStatus("Ready");
      } catch (err) {
        setStatus(err.message);
      }
    }

    function setView(view) {
      state.view = view;
      document.querySelectorAll("#nav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === view);
      });
      document.querySelectorAll(".view").forEach((section) => section.classList.remove("active"));
      $(`${view === "jarvis" ? "chat" : view}View`).classList.add("active");
      const titles = {
        chat: ["Chat", "Talk with Infinity using memory, files, and agents."],
        jarvis: ["Jarvis", "Your default personal assistant with memory and voice ready."],
        files: ["Files", "Upload text files and attach them to chat."],
        memories: ["Memory", "Save facts Infinity should keep using."],
        agents: ["Agents", "Create focused assistants with their own instructions."],
        workflows: ["Workflows", "Chain prompt steps with input and previous output."]
      };
      $("viewTitle").textContent = titles[view][0];
      $("viewSubtitle").textContent = titles[view][1];
      renderSelectors();
    }

    function renderAll() {
      renderSelectors();
      renderFiles();
      renderMemories();
      renderAgents();
      renderWorkflows();
    }

    function renderSelectors() {
      const jarvis = jarvisAgent();
      const selectedAgent = $("agentSelect").value;
      const selectedWorkflow = $("workflowSelect").value;
      const checkedFiles = new Set(selectedFileIds().map(String));
      $("agentSelect").innerHTML = [`<option value="">Infinity</option>`]
        .concat(state.agents.map((agent) => `<option value="${agent.id}">${escapeText(agent.name)}</option>`))
        .join("");
      if (state.view === "jarvis" && jarvis) $("agentSelect").value = String(jarvis.id);
      else if (selectedAgent) $("agentSelect").value = selectedAgent;

      $("workflowSelect").innerHTML = [`<option value="">No workflow</option>`]
        .concat(state.workflows.map((workflow) => `<option value="${workflow.id}">${escapeText(workflow.name)}</option>`))
        .join("");
      if (state.pendingWorkflowId) $("workflowSelect").value = String(state.pendingWorkflowId);
      else if (selectedWorkflow) $("workflowSelect").value = selectedWorkflow;

      $("chatFiles").innerHTML = state.files.length
        ? state.files.map((file) => `
          <label><input type="checkbox" value="${file.id}" ${checkedFiles.has(String(file.id)) ? "checked" : ""}> ${escapeText(file.filename)}</label>
        `).join("")
        : `<div class="item-meta">No files uploaded.</div>`;
    }

    function renderFiles() {
      $("filesList").innerHTML = state.files.length ? state.files.map((file) => `
        <div class="item">
          <div class="item-title">${escapeText(file.filename)}</div>
          <div class="item-meta">${file.text_available ? "Text available to chat" : "Stored as binary"} - ${escapeText(file.content_type || "unknown")}</div>
          <div class="item-actions"><button class="danger" onclick="deleteFile(${file.id})">Delete</button></div>
        </div>
      `).join("") : `<div class="item-meta">No files yet.</div>`;
    }

    function renderMemories() {
      $("memoriesList").innerHTML = state.memories.length ? state.memories.map((memory) => `
        <div class="item">
          <div>${escapeText(memory.content)}</div>
          <div class="item-meta">${escapeText(memory.created_at)}</div>
          <div class="item-actions"><button class="danger" onclick="deleteMemory(${memory.id})">Delete</button></div>
        </div>
      `).join("") : `<div class="item-meta">No saved memories yet.</div>`;
    }

    function renderAgents() {
      $("agentsList").innerHTML = state.agents.map((agent) => `
        <div class="item">
          <div class="item-title">${escapeText(agent.name)}${agent.is_default ? " - default" : ""}</div>
          <div>${escapeText(agent.description || "")}</div>
          <div class="item-meta">${escapeText(agent.instructions)}</div>
          <div class="item-actions">
            <button onclick="editAgent(${agent.id})">Edit</button>
            ${agent.is_default ? "" : `<button class="danger" onclick="deleteAgent(${agent.id})">Delete</button>`}
          </div>
        </div>
      `).join("");
    }

    function renderWorkflows() {
      $("workflowsList").innerHTML = state.workflows.length ? state.workflows.map((workflow) => `
        <div class="item">
          <div class="item-title">${escapeText(workflow.name)}</div>
          <div>${escapeText(workflow.description || "")}</div>
          <div class="item-meta">${workflow.steps.length} step(s)</div>
          <div class="item-actions">
            <button onclick="editWorkflow(${workflow.id})">Edit</button>
            <button onclick="runWorkflow(${workflow.id})">Run</button>
            <button onclick="chooseWorkflow(${workflow.id})">Chat</button>
            <button class="danger" onclick="deleteWorkflow(${workflow.id})">Delete</button>
          </div>
        </div>
      `).join("") : `<div class="item-meta">No workflows yet.</div>`;
    }

    function selectedFileIds() {
      return [...document.querySelectorAll("#chatFiles input:checked")].map((input) => Number(input.value));
    }

    function appendMessage(role, content) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.textContent = content;
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function speak(text) {
      if (!$("speakToggle").checked || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    async function sendChat(event) {
      event.preventDefault();
      const input = $("chatInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      appendMessage("user", text);
      setStatus("Thinking...");
      try {
        const workflowId = Number($("workflowSelect").value || state.pendingWorkflowId || 0) || null;
        const data = await api("/v1/chat/completions", {
          method: "POST",
          body: JSON.stringify({
            model: "infinity-1",
            session_id: state.sessionId,
            messages: [{ role: "user", content: text }],
            agent_id: Number($("agentSelect").value) || null,
            workflow_id: workflowId,
            file_ids: selectedFileIds(),
            use_memory: $("memoryToggle").checked
          })
        });
        const reply = data.choices[0].message.content;
        appendMessage("assistant", reply);
        speak(reply);
        state.pendingWorkflowId = null;
        await refresh();
        setStatus("Ready");
      } catch (err) {
        appendMessage("assistant", err.message);
        setStatus("Error");
      }
    }

    window.deleteFile = async (id) => {
      await runSafely("Deleting file...", "File deleted", async () => {
        await api(`/v1/files/${id}`, { method: "DELETE" });
        await refresh();
      });
    };

    window.deleteMemory = async (id) => {
      await runSafely("Deleting memory...", "Memory deleted", async () => {
        await api(`/v1/memories/${id}`, { method: "DELETE" });
        await refresh();
      });
    };

    window.editAgent = (id) => {
      const agent = state.agents.find((item) => item.id === id);
      if (!agent) return;
      state.editAgentId = id;
      $("agentFormTitle").textContent = "Edit agent";
      $("agentName").value = agent.name;
      $("agentDescription").value = agent.description || "";
      $("agentInstructions").value = agent.instructions;
      $("agentCancelBtn").classList.remove("hidden");
    };

    window.deleteAgent = async (id) => {
      await runSafely("Deleting agent...", "Agent deleted", async () => {
        await api(`/v1/agents/${id}`, { method: "DELETE" });
        await refresh();
      });
    };

    window.editWorkflow = (id) => {
      const workflow = state.workflows.find((item) => item.id === id);
      if (!workflow) return;
      state.editWorkflowId = id;
      state.runWorkflowId = id;
      $("workflowFormTitle").textContent = "Edit workflow";
      $("workflowName").value = workflow.name;
      $("workflowDescription").value = workflow.description || "";
      $("workflowSteps").value = workflow.steps.join("\n");
      $("workflowCancelBtn").classList.remove("hidden");
    };

    window.chooseWorkflow = (id) => {
      state.pendingWorkflowId = id;
      setView("chat");
      renderSelectors();
      setStatus("Workflow selected for next chat");
    };

    async function executeWorkflow() {
      const workflowId = state.runWorkflowId || state.editWorkflowId;
      if (!workflowId) {
        setStatus("Choose a workflow to run");
        return;
      }
      const data = await runSafely("Running workflow...", "Workflow complete", async () => api(`/v1/workflows/${workflowId}/run`, {
        method: "POST",
        body: JSON.stringify({
          input: $("workflowInput").value || "",
          agent_id: Number($("agentSelect").value) || null,
          file_ids: selectedFileIds(),
          use_memory: $("memoryToggle").checked
        })
      }));
      if (!data) return;
      $("workflowOutput").classList.remove("hidden");
      $("workflowOutput").textContent = data.final_output;
    }

    window.runWorkflow = async (id) => {
      state.runWorkflowId = id;
      await executeWorkflow();
    };

    window.deleteWorkflow = async (id) => {
      await runSafely("Deleting workflow...", "Workflow deleted", async () => {
        await api(`/v1/workflows/${id}`, { method: "DELETE" });
        if (state.editWorkflowId === id) state.editWorkflowId = null;
        if (state.runWorkflowId === id) state.runWorkflowId = null;
        if (state.pendingWorkflowId === id) state.pendingWorkflowId = null;
        await refresh();
      });
    };

    $("chatForm").addEventListener("submit", sendChat);
    $("nav").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-view]");
      if (button) setView(button.dataset.view);
    });
    $("newChatBtn").addEventListener("click", () => {
      state.sessionId = newId();
      localStorage.setItem("infinity_session", state.sessionId);
      $("messages").innerHTML = "";
      setStatus("New chat ready");
    });
    $("codeBtn").addEventListener("click", () => {
      $("chatInput").value = $("chatInput").value || "Write code for ";
      $("chatInput").focus();
    });
    $("workflowChatBtn").addEventListener("click", () => {
      state.pendingWorkflowId = Number($("workflowSelect").value) || null;
      $("chatInput").focus();
    });

    $("fileForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = $("fileInput").files[0];
      if (!file) return;
      const form = new FormData();
      form.append("file", file);
      await runSafely("Uploading file...", "File uploaded", async () => {
        await api("/v1/files", { method: "POST", body: form });
        $("fileInput").value = "";
        await refresh();
      });
    });

    $("memoryForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = $("memoryInput").value.trim();
      if (!content) return;
      await runSafely("Saving memory...", "Memory saved", async () => {
        await api("/v1/memories", { method: "POST", body: JSON.stringify({ content }) });
        $("memoryInput").value = "";
        await refresh();
      });
    });

    $("agentForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        name: $("agentName").value,
        description: $("agentDescription").value,
        instructions: $("agentInstructions").value
      };
      const path = state.editAgentId ? `/v1/agents/${state.editAgentId}` : "/v1/agents";
      await runSafely("Saving agent...", "Agent saved", async () => {
        await api(path, { method: state.editAgentId ? "PUT" : "POST", body: JSON.stringify(payload) });
        state.editAgentId = null;
        event.target.reset();
        $("agentFormTitle").textContent = "Create agent";
        $("agentCancelBtn").classList.add("hidden");
        await refresh();
      });
    });

    $("agentCancelBtn").addEventListener("click", () => {
      state.editAgentId = null;
      $("agentForm").reset();
      $("agentFormTitle").textContent = "Create agent";
      $("agentCancelBtn").classList.add("hidden");
    });

    $("workflowForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        name: $("workflowName").value,
        description: $("workflowDescription").value,
        steps: $("workflowSteps").value.split("\n").map((step) => step.trim()).filter(Boolean)
      };
      const path = state.editWorkflowId ? `/v1/workflows/${state.editWorkflowId}` : "/v1/workflows";
      await runSafely("Saving workflow...", "Workflow saved", async () => {
        const saved = await api(path, { method: state.editWorkflowId ? "PUT" : "POST", body: JSON.stringify(payload) });
        state.runWorkflowId = saved.id;
        state.editWorkflowId = null;
        event.target.reset();
        $("workflowFormTitle").textContent = "Create workflow";
        $("workflowCancelBtn").classList.add("hidden");
        await refresh();
      });
    });

    $("workflowRunBtn").addEventListener("click", executeWorkflow);

    $("workflowCancelBtn").addEventListener("click", () => {
      state.editWorkflowId = null;
      $("workflowForm").reset();
      $("workflowFormTitle").textContent = "Create workflow";
      $("workflowCancelBtn").classList.add("hidden");
    });

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      $("listenBtn").disabled = true;
      $("listenBtn").textContent = "No voice";
    } else {
      $("listenBtn").addEventListener("click", () => {
        const recognition = new Recognition();
        recognition.lang = "en-US";
        recognition.onresult = (event) => {
          $("chatInput").value = event.results[0][0].transcript;
          $("chatInput").focus();
        };
        recognition.start();
      });
    }

    boot();
  </script>
</body>
</html>
